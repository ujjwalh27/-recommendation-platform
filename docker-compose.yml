version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
      - VLM_MODEL=minicpm-v
      - DEBUG_MODE=True
    volumes:
      - ./datasets:/app/datasets
      - ./debug_outputs:/app/debug_outputs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
