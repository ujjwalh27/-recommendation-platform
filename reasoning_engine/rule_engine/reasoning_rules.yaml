# CMREE Reasoning Rules
# Version: 3.0-cmree-canonical
# Explanatory, deterministic, rule-based inference rules mapped strictly to 13 Canonical Categories.

rules:
  - id: "RULE_001_JALABHISHEKAM"
    name: "Jalabhishekam Water Pouring Rule"
    conditions:
      objects_any: ["Shiva Linga", "Water Vessel", "Kalash", "Dark Stone Structure", "Sacred Object"]
      text_contains: ["Jalabhishekam", "Jal Abhishek", "Pouring Water", "Water Pouring", "Bathing Lingam", "Water over Lingam", "Water"]
    output:
      primary_ritual: "Jalabhishekam"
      primary_category: "Abhishekam"
      primary_deity: "Lord Shiva"
      offering: "Water"
    base_confidence: 0.96
    explanation: "Shiva Lingam or sacred object combined with water pouring / jalabhishekam indicators confirms Abhishekam."

  - id: "RULE_002_MILK_ABHISHEKAM"
    name: "Milk Abhishekam Pouring Rule"
